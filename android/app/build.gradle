plugins { id 'com.android.application' }

android {
    namespace 'org.supermariowar.app'
    compileSdk 35
    ndkVersion '27.2.12479018'
    defaultConfig {
        applicationId 'org.supermariowar.app'
        minSdk 23
        targetSdk 35
        versionCode 6
        versionName '2.0.0-stage2-touchfix'
        ndk { abiFilters 'arm64-v8a' }
    }
    sourceSets.main {
        java.srcDirs += ['../deps/SDL/android-project/app/src/main/java']
        assets.srcDirs = [layout.buildDirectory.dir('generated/assets')]
        jniLibs.srcDirs = ['../../build-android-arm64/apk-libs']
    }
    buildFeatures { buildConfig true }
}

// Keep the data layout intact: native code enumerates directories and uses stdio.
tasks.register('stageGameAssets', Sync) {
    from('../../data') { into 'data'; exclude '.git', '.git/**' }
    into layout.buildDirectory.dir('generated/assets')
}
tasks.named('preBuild').configure {
    dependsOn 'stageGameAssets'
    doFirst {
        if (!file('../../build-android-arm64/apk-libs/arm64-v8a/libmain.so').isFile()) {
            throw new GradleException('Build native libraries first: ./build.sh')
        }
        if (!file('../../data/gfx').isDirectory()) {
            throw new GradleException('Initialize game data: git submodule update --init --recursive')
        }
    }
}
